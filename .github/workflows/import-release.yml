name: Importar versión de Criterios de referencia
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initial-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == '9ph9jr6j75-collab/criterios-de-referencia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Verificar e importar los archivos de la app
        shell: bash
        run: |
          python3 - <<'PY_SOURCE'
          #!/usr/bin/env python3
          """Verify the uploaded bundles and materialize their source files safely."""
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat
          import tempfile
          import zipfile


          def digest(path: Path) -> str:
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()


          def source_path(name: str) -> PurePosixPath:
              path = PurePosixPath(name)
              if not name or '\\' in name or path.is_absolute() or '..' in path.parts or '.' in path.parts or path.as_posix() != name:
                  raise ValueError(f'Invalid source path: {name!r}')
              if any(part in {'.git', '.openai', 'dist', 'node_modules', 'qa', '__pycache__'} for part in path.parts):
                  raise ValueError(f'Excluded source path: {name!r}')
              if any(part.startswith('.') for part in path.parts if part not in {'.github', '.gitignore'}):
                  raise ValueError(f'Hidden source path: {name!r}')
              return path


          def main() -> None:
              root = Path.cwd().resolve()
              manifest_path = root / 'release-import-manifest.json'
              manifest = json.loads(manifest_path.read_text())
              if manifest.get('format') != 1 or manifest.get('applicationId') != 'criterios-de-referencia' or manifest.get('repository') != '9ph9jr6j75-collab/criterios-de-referencia':
                  raise ValueError('Unexpected application or repository manifest.')
              records = {}
              for record in manifest['files']:
                  name = record['path']
                  source_path(name)
                  if name in records or not isinstance(record['size'], int) or record['size'] < 0 or not re.fullmatch('[0-9a-f]{64}', record['sha256']):
                      raise ValueError(f'Invalid or duplicate file record: {name}')
                  if name.startswith('.github/workflows/') != (record['bundle'] is None):
                      raise ValueError(f'Workflow must be installed by connector first: {name}')
                  records[name] = record
              bundle_map = {record['name']: record for record in manifest['bundles']}
              if len(bundle_map) != len(manifest['bundles']):
                  raise ValueError('Duplicate bundle record.')
              listed = {record['bundle'] for record in records.values() if record['bundle']}
              if listed != set(bundle_map):
                  raise ValueError('File and bundle lists differ.')
              if set(path.name for path in root.glob('release-source-*.zip')) != set(bundle_map):
                  raise ValueError('The uploaded bundles differ from the manifest.')
              with tempfile.TemporaryDirectory(prefix='github-source-import-') as temporary:
                  stage = Path(temporary)
                  seen = set()
                  for name, bundle in sorted(bundle_map.items()):
                      if not re.fullmatch(r'release-source-\d{3}\.zip', name):
                          raise ValueError('Invalid bundle name.')
                      bundle_path = root / name
                      if bundle_path.is_symlink() or bundle_path.stat().st_size != bundle['size'] or digest(bundle_path) != bundle['sha256']:
                          raise ValueError(f'Bundle hash or size mismatch: {name}')
                      if bundle['size'] > 20 * 1024 * 1024:
                          raise ValueError(f'Bundle is too large: {name}')
                      with zipfile.ZipFile(bundle_path) as archive:
                          for member in archive.infolist():
                              member_name = member.filename
                              path = source_path(member_name)
                              record = records.get(member_name)
                              if member.is_dir() or stat.S_ISLNK(member.external_attr >> 16) or member.flag_bits & 1 or member_name in seen or not record or record['bundle'] != name or member.file_size != record['size']:
                                  raise ValueError(f'Invalid or unexpected ZIP entry: {member_name}')
                              payload = archive.read(member)
                              if hashlib.sha256(payload).hexdigest() != record['sha256']:
                                  raise ValueError(f'Source hash mismatch: {member_name}')
                              target = stage.joinpath(*path.parts)
                              target.parent.mkdir(parents=True, exist_ok=True)
                              target.write_bytes(payload)
                              seen.add(member_name)
                  expected = {name for name, record in records.items() if record['bundle']}
                  if seen != expected:
                      raise ValueError('The source set is incomplete.')
                  for name, record in records.items():
                      target = root.joinpath(*source_path(name).parts)
                      if not target.resolve().is_relative_to(root) or any(parent.is_symlink() for parent in [target, *target.parents] if parent.is_relative_to(root)):
                          raise ValueError(f'Target path leaves checkout: {name}')
                      if record['bundle'] is None:
                          if not target.is_file() or target.stat().st_size != record['size'] or digest(target) != record['sha256']:
                              raise ValueError(f'Install the exact workflow via connector before importing: {name}')
                  # All bundles, paths and hashes are validated before altering the checkout.
                  for name in sorted(expected):
                      target = root.joinpath(*source_path(name).parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(stage.joinpath(*source_path(name).parts), target)
              for name in bundle_map:
                  (root / name).unlink()
              manifest_path.unlink()
              print(json.dumps({'verifiedFiles': len(records), 'importedFiles': len(seen), 'sourceBytes': sum(record['size'] for record in records.values())}))


          if __name__ == '__main__':
              main()
          PY_SOURCE
      - name: Comprobar los datos y preparar la app
        run: |
          node scripts/check.mjs
          node scripts/build.mjs
      - name: Guardar la fuente en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publicar la fuente de Criterios de referencia"
          git push origin HEAD:main
