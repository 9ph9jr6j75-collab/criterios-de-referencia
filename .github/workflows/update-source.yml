name: Actualizar Criterios de referencia
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-source-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == '9ph9jr6j75-collab/criterios-de-referencia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Verificar e incorporar la actualización revisada
        shell: bash
        run: |
          python3 - <<'PY_UPDATE'
          #!/usr/bin/env python3
          """Validate reviewed source changes and nine exact general-checklist corrections."""
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import tempfile
          import zipfile
          
          REPOSITORY = '9ph9jr6j75-collab/criterios-de-referencia'
          BASE_COMMIT = 'd84215f3eeb1dfb992c7a4871632824235654428'
          MANIFEST = 'source-update-manifest.json'
          BUNDLE = 'source-update-v1.4.16.zip'
          MANIFEST_SHA256 = '64e7adb1e48a4525d3ddc2dc41f11ff808fe2bad6a88d032eeda5473a50783e2'
          ROOT_FILES = {'README.md', 'app.js', 'catalog.js', 'index.html', 'styles.css', 'review-content.js', 'package.json', 'sw.js'}
          REVIEW_AUDIT = 'audits/2026-10-29-general-checklists.json'
          
          
          """Exact data-card correction policy, embedded into the reviewed updater."""
          APPROVED_GENERAL_IDS = frozenset({
              'r01-medicina-familiar-y-comunitaria-requisitos-generales-de-medicina-familiar-y-comunitaria',
              'r01-medicina-interna-requisitos-generales-de-medicina-interna',
              'r01-medicina-paliativa-y-control-del-dolor-requisitos-generales-de-medicina-paliativa-y-control-del-dolor',
              'r01-neurologia-requisitos-generales-de-neurologia',
              'r01-oftalmologia-requisitos-generales-de-oftalmologia',
              'r01-oncologia-requisitos-generales-de-oncologia',
              'r01-ortopedia-requisitos-generales-de-ortopedia',
              'r01-otorrinolaringologia-requisitos-generales-de-otorrinolaringologia',
              'n08-requisitos-generales-y-referencia-a-soporte-nutricional',
          })
          APPROVED_GENERAL_FIELDS = frozenset({'checklist', 'reviewNotes'})
          
          
          def validate_clinical_change(before_payload: bytes, after_payload: bytes, policy: dict) -> dict:
              """Reject every data change outside nine formerly empty general checklists."""
              if not isinstance(policy, dict) or set(policy.get('allowedCardIds', [])) != APPROVED_GENERAL_IDS or len(policy.get('allowedCardIds', [])) != 9:
                  raise ValueError('Unexpected general-card authorization')
              if set(policy.get('allowedFields', [])) != APPROVED_GENERAL_FIELDS or len(policy.get('allowedFields', [])) != 2:
                  raise ValueError('Unexpected authorized clinical fields')
              before = json.loads(before_payload)
              after = json.loads(after_payload)
              if not isinstance(before, list) or not isinstance(after, list) or len(before) != 808 or len(after) != 808 or policy.get('cardCount') != 808:
                  raise ValueError('Clinical card counts changed')
              before_ids = [card.get('id') for card in before]
              after_ids = [card.get('id') for card in after]
              if before_ids != after_ids or len(set(before_ids)) != len(before_ids):
                  raise ValueError('Clinical card identity or order changed')
              before_rows = sum(len(card.get('checklist', [])) for card in before)
              after_rows = sum(len(card.get('checklist', [])) for card in after)
              if before_rows != 2202 or policy.get('checklistItemsBefore') != before_rows or policy.get('checklistItemsAfter') != after_rows:
                  raise ValueError('Unexpected checklist item counts')
              changed = set()
              for previous, current in zip(before, after):
                  card_id = previous['id']
                  fields = {key for key in set(previous) | set(current) if previous.get(key) != current.get(key) or (key in previous) != (key in current)}
                  if not fields:
                      continue
                  if card_id not in APPROVED_GENERAL_IDS or not fields <= APPROVED_GENERAL_FIELDS:
                      raise ValueError('Unauthorized clinical change: ' + card_id + ' / ' + ', '.join(sorted(fields)))
                  if previous.get('checklist') != [] or not previous.get('name', '').lower().startswith('requisitos generales'):
                      raise ValueError('Authorized card was not an empty general checklist: ' + card_id)
                  rows = current.get('checklist')
                  if not isinstance(rows, list) or not rows:
                      raise ValueError('General checklist remains empty: ' + card_id)
                  seen = set()
                  for row in rows:
                      if not isinstance(row, dict) or not {'id', 'text', 'kind', 'requirement'} <= set(row):
                          raise ValueError('Incomplete general checklist row: ' + card_id)
                      if set(row) - {'id', 'text', 'kind', 'requirement', 'legacyIds'}:
                          raise ValueError('Unexpected general checklist row fields: ' + card_id)
                      if not isinstance(row['id'], str) or not row['id'] or row['id'] in seen or not isinstance(row['text'], str) or not row['text'].strip():
                          raise ValueError('Invalid general checklist identity or text: ' + card_id)
                      if row['kind'] not in {'criterion', 'study', 'history', 'prior', 'general', 'treatment'} or row['requirement'] not in {'source', 'conditional', 'desirable', 'required'}:
                          raise ValueError('Invalid general checklist classification: ' + card_id)
                      if 'legacyIds' in row and (not isinstance(row['legacyIds'], list) or not all(isinstance(value, str) for value in row['legacyIds'])):
                          raise ValueError('Invalid general checklist legacy identities: ' + card_id)
                      seen.add(row['id'])
                  if 'reviewNotes' in current and (not isinstance(current['reviewNotes'], list) or not all(isinstance(note, str) for note in current['reviewNotes'])):
                      raise ValueError('Invalid general review notes: ' + card_id)
                  changed.add(card_id)
              if changed != APPROVED_GENERAL_IDS:
                  raise ValueError('The nine authorized general checklists were not all corrected')
              return {'changedCardIds': sorted(changed), 'changedCards': len(changed), 'cardCount': len(after), 'checklistItemsBefore': before_rows, 'checklistItemsAfter': after_rows, 'unchangedFields': 'all fields except checklist/reviewNotes in the nine authorized cards'}
          
          
          def digest_bytes(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()
          
          
          def approved_path(name: str) -> PurePosixPath:
              path = PurePosixPath(name)
              if not name or path.is_absolute() or '\\' in name or '..' in path.parts or '.' in path.parts or path.as_posix() != name:
                  raise ValueError(f'Unsafe update path: {name!r}')
              permitted = name in ROOT_FILES or name == REVIEW_AUDIT or name == 'data/cards.json' or name == 'scripts/test-r01-general-checklists.mjs' or name == 'data/release.json' or name == 'scripts/build.mjs' or bool(re.fullmatch(r'scripts/(?:check-[a-z-]+|test-[a-z-]+)\.mjs', name))
              if not permitted:
                  raise ValueError(f'Path outside the reviewed source update: {name}')
              return path
          
          
          def target_path(root: Path, name: str) -> Path:
              target = root.joinpath(*approved_path(name).parts)
              if not target.resolve().is_relative_to(root):
                  raise ValueError(f'Target leaves checkout: {name}')
              if any(path.is_symlink() for path in [target, *target.parents] if path.is_relative_to(root)):
                  raise ValueError(f'Symlink target: {name}')
              return target
          
          
          def validate_payload(root: Path, manifest_hash: str = MANIFEST_SHA256) -> tuple[dict, dict[str, bytes]]:
              manifest_path = root / MANIFEST
              if manifest_path.is_symlink():
                  raise ValueError('Symlink manifest')
              raw_manifest = manifest_path.read_bytes()
              if digest_bytes(raw_manifest) != manifest_hash:
                  raise ValueError('Manifest hash differs from the reviewed manifest')
              manifest = json.loads(raw_manifest)
              if manifest.get('format') != 1 or manifest.get('repository') != REPOSITORY or manifest.get('baseCommit') != BASE_COMMIT or manifest.get('version') != '1.4.16':
                  raise ValueError('Unexpected update manifest')
              bundle = manifest['bundle']
              if bundle.get('name') != BUNDLE:
                  raise ValueError('Unexpected bundle name')
              bundle_path = root / BUNDLE
              if bundle_path.is_symlink() or bundle_path.stat().st_size != bundle['size'] or digest_bytes(bundle_path.read_bytes()) != bundle['sha256']:
                  raise ValueError('Bundle size or SHA-256 differs')
              records = {}
              for record in manifest['files']:
                  name = record['path']
                  approved_path(name)
                  if name in records:
                      raise ValueError(f'Duplicate update file: {name}')
                  after = record['after']
                  before = record['before']
                  for details in [after, before] if before is not None else [after]:
                      if not isinstance(details['size'], int) or not 0 <= details['size'] <= 5 * 1024 * 1024 or not re.fullmatch(r'[0-9a-f]{64}', details['sha256']):
                          raise ValueError(f'Invalid size or hash for {name}')
                  target = target_path(root, name)
                  if before is None:
                      if target.exists():
                          raise ValueError(f'New file already exists: {name}')
                  elif not target.is_file() or target.stat().st_size != before['size'] or digest_bytes(target.read_bytes()) != before['sha256']:
                      raise ValueError(f'Existing file differs from the reviewed base: {name}')
                  records[name] = record
              if not records or sum(record['after']['size'] for record in records.values()) > 10 * 1024 * 1024:
                  raise ValueError('Empty or oversized source update')
              stage = {}
              with zipfile.ZipFile(bundle_path) as archive:
                  for member in archive.infolist():
                      name = member.filename
                      approved_path(name)
                      record = records.get(name)
                      if member.is_dir() or stat.S_ISLNK(member.external_attr >> 16) or member.flag_bits & 1 or name in stage or record is None or member.file_size != record['after']['size']:
                          raise ValueError(f'Unexpected ZIP member: {name}')
                      payload = archive.read(member)
                      if digest_bytes(payload) != record['after']['sha256']:
                          raise ValueError(f'Updated file hash differs: {name}')
                      stage[name] = payload
              if set(stage) != set(records):
                  raise ValueError('The source update is incomplete')
              if 'data/cards.json' not in stage:
                  raise ValueError('Authorized general-card correction is missing')
              validate_clinical_change((root / 'data/cards.json').read_bytes(), stage['data/cards.json'], manifest.get('clinicalCorrection'))
              # Sources and topics are immutable; cards have the exact semantic policy above.
              for record in manifest['protectedFiles']:
                  if record['path'] not in {'data/sources.json', 'data/topics.json'}:
                      raise ValueError('Unexpected protected file')
                  target = root / record['path']
                  if target.is_symlink() or not target.is_file() or target.stat().st_size != record['size'] or digest_bytes(target.read_bytes()) != record['sha256']:
                      raise ValueError(f'Clinical data differ from the reviewed base: {record["path"]}')
              return manifest, stage
          
          
          def main() -> None:
              root = Path.cwd().resolve()
              if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY:
                  raise ValueError('Unexpected GitHub repository')
              subprocess.run(['git', 'merge-base', '--is-ancestor', BASE_COMMIT, 'HEAD'], check=True)
              manifest, stage = validate_payload(root)
              # Every target, old hash, new hash and archive member passed before any write.
              for name, payload in sorted(stage.items()):
                  target = target_path(root, name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
              (root / BUNDLE).unlink()
              (root / MANIFEST).unlink()
              print(json.dumps({'verifiedUpdateFiles': len(stage), 'version': manifest['version'], 'preservedClinicalFiles': [record['path'] for record in manifest['protectedFiles']], 'correctedGeneralCards': len(APPROVED_GENERAL_IDS), 'checklistItemsBefore': manifest['clinicalCorrection']['checklistItemsBefore'], 'checklistItemsAfter': manifest['clinicalCorrection']['checklistItemsAfter']}))
          
          
          if __name__ == '__main__':
              main()
          
          PY_UPDATE
      - name: Comprobar contenido, navegación y compilación
        run: |
          node scripts/check.mjs
          node scripts/test-document-selection.mjs
          node scripts/test-catalog-filters.mjs
          node scripts/test-r01-general-checklists.mjs
          node scripts/test-nutrition-general-checklist.mjs
          node scripts/test-review-content.mjs
          node scripts/test-edus-guidance.mjs
          node scripts/check-analytics.mjs
          node scripts/check-content.mjs
          node scripts/check-content-duplicates.mjs
          node scripts/check-general-requirements.mjs
          node scripts/check-combined-review.mjs
          node scripts/check-universal-generals.mjs
          node scripts/check-print.mjs
          node scripts/check-print-session.mjs
          node scripts/check-sw.mjs
          node scripts/build.mjs
      - name: Guardar la actualización verificada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Corregir filtros y revisión de requisitos generales"
          git push origin HEAD:main
