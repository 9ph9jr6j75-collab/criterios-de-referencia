name: Publicar Criterios de referencia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preparar el visor de documentos
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf-tools"
          "$RUNNER_TEMP/pdf-tools/bin/pip" install PyMuPDF==1.26.6 Pillow==12.0.0
          echo "$RUNNER_TEMP/pdf-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .cache/guide-pages
          key: guide-pages-${{ runner.os }}-${{ hashFiles('scripts/render-guide-pages.py', '.github/workflows/github-pages.yml') }}-${{ hashFiles('assets/documents/N2*.pdf', 'assets/documents/N3*.pdf') }}
          restore-keys: |
            guide-pages-${{ runner.os }}-${{ hashFiles('scripts/render-guide-pages.py', '.github/workflows/github-pages.yml') }}-
      - name: Comprobar datos y navegación de fuentes
        run: node scripts/check.mjs
      - name: Preparar aplicación
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
